  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      typeof nextState !== &quot;object&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    globalThis.dispatchEvent(

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);

        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {

    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

    const geometry = new THREE.PlaneGeometry(planeSize, planeSize);
    const material = new THREE.MeshBasicMaterial({
      color: new THREE.Color(color),
      transparent: true,
      opacity,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.z = z;
    world.add(mesh);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry),
      new THREE.LineBasicMaterial({ color: new THREE.Color(color), transparent: true, opacity: 0.85 })
    );
    edges.position.z = z;
    world.add(edges);
    return mesh;
  }

  const genericRedshiftPlanes = [
    { redshift: 0.25, worldZ: 2.0 },
    { redshift: 0.75, worldZ: 6.0 },
    { redshift: 1.25, worldZ: 10.0 }
  ];

  genericRedshiftPlanes.forEach((slice) =&gt; planeAt(slice.worldZ, colors.muted, 0.055));
  planeAt(imagePlaneZ, colors.image, 0.12);
  planeAt(lensPlaneZ, colors.lens, 0.12);
  planeAt(sourcePlaneZ, colors.source, 0.12);

  function makeLabel(text, color, width = 4.8, height = 0.7) {
    const canvas = document.createElement(&quot;canvas&quot;);
    canvas.width = 768;
    canvas.height = 112;
    const context = canvas.getContext(&quot;2d&quot;);
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.font = &quot;500 42px &#x27;Segoe UI&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif&quot;;
    context.fillStyle = color;
    context.textAlign = &quot;center&quot;;
    context.textBaseline = &quot;middle&quot;;
    context.fillText(text, canvas.width / 2, canvas.height / 2);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
    sprite.scale.set(width, height, 1);
    sprite.renderOrder = 20;
    world.add(sprite);
    return sprite;
  }

  const observerLabel = makeLabel(&quot;观察者 O：z = 0&quot;, colors.foreground);
  observerLabel.position.set(0, 1.15, observerZ - 0.25);
  const imageLabel = makeLabel(&quot;像平面 / 天空角坐标 θ&quot;, colors.image);
  imageLabel.position.set(0, 3.15, imagePlaneZ);
  const lensLabel = makeLabel(&quot;透镜平面 zₗ（前景星系）&quot;, colors.lens);
  lensLabel.position.set(0, 3.15, lensPlaneZ);
  const sourceLabel = makeLabel(&quot;源平面 zₛ（背景星系）&quot;, colors.source);
  sourceLabel.position.set(0, 3.15, sourcePlaneZ);

  genericRedshiftPlanes.forEach((slice) =&gt; {
    const label = makeLabel(`普通红移切片 z = ${slice.redshift.toFixed(2)}`, colors.muted, 2.7, 0.42);
    label.position.set(-3.55, -2.65, slice.worldZ);
  });

  const axisGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, -0.5),
    new THREE.Vector3(0, 0, 10.6)
  ]);
  const axis = new THREE.Line(
    axisGeometry,
    new THREE.LineDashedMaterial({ color: new THREE.Color(colors.foreground), dashSize: 0.18, gapSize: 0.12, transparent: true, opacity: 0.72 })

  world.add(axis);

  const observer = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 24, 16),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colors.foreground) })
  );
  observer.position.set(0, 0, observerZ);
  world.add(observer);

  const lensGalaxy = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 40, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colors.lens), transparent: true, opacity: 0.92 })
  );
  lensGalaxy.scale.set(1.35, 0.8, 0.45);
  lensGalaxy.position.set(0, 0, lensPlaneZ);
  world.add(lensGalaxy);

  const sourceGalaxy = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 32, 20),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colors.source) })
  );
  sourceGalaxy.scale.set(1.2, 0.75, 0.35);
  sourceGalaxy.position.set(0, 0, sourcePlaneZ);
  world.add(sourceGalaxy);

  const rayGroup = new THREE.Group();
  const imageMarkGroup = new THREE.Group();
  world.add(rayGroup);
  world.add(imageMarkGroup);

  function clearGroup(group) {
    while (group.children.length) {
      const item = group.children.pop();
      item.geometry?.dispose();
      item.material?.dispose();

  function addRay(lensX, lensY, sourceX) {
    const curve = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, observerZ),
      new THREE.Vector3(lensX, lensY, lensPlaneZ),
      new THREE.Vector3(sourceX, 0, sourcePlaneZ)
    ]);
    rayGroup.add(new THREE.Line(
      curve,
      new THREE.LineBasicMaterial({ color: new THREE.Color(colors.ray), transparent: true, opacity: 0.82 })
    ));
  }

  function addImageMark(thetaX, thetaY) {
    const directionScale = imagePlaneZ / lensPlaneZ;
    const mark = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 20, 14),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(colors.accent) })
    );
    mark.position.set(thetaX * directionScale, thetaY * directionScale, imagePlaneZ + 0.03);
    imageMarkGroup.add(mark);
  }

  function updateGeometry(beta) {
    clearGroup(rayGroup);
    clearGroup(imageMarkGroup);

    const sourceWorldX = beta * 1.55;
    sourceGalaxy.position.x = sourceWorldX;

    if (beta &lt; 0.025) {
      const rayCount = 16;
      for (let index = 0; index &lt; rayCount; index += 1) {
        const angle = 2 * Math.PI * index / rayCount;
        const lensX = 1.55 * Math.cos(angle);
        const lensY = 1.55 * Math.sin(angle);
        addRay(lensX, lensY, sourceWorldX);
        addImageMark(lensX, lensY);
      }
      status.innerHTML = &quot;&lt;strong&gt;红移平面族：&lt;/strong&gt;灰色切片表示任意 z=常数 的距离层；橙色透镜平面 zₗ=0.5 和绿色源平面 zₛ=1.0 是其中两张被选中的切片。&lt;br&gt;&lt;strong&gt;β = 0：&lt;/strong&gt;源位于主光轴上，像平面上的像连成爱因斯坦环。&quot;;
    } else {
      const thetaPlus = beta + 1;
      const thetaMinus = beta - 1;
      addRay(thetaPlus * 1.55, 0, sourceWorldX);
      addImageMark(thetaPlus * 1.55, 0);

      if (beta &lt; 1) {

        addImageMark(thetaMinus * 1.55, 0);
        status.innerHTML = `&lt;strong&gt;红移平面族：&lt;/strong&gt;灰色切片表示任意 z=常数 的距离层；橙色 zₗ=0.5 和绿色 zₛ=1.0 是两张特定切片。&lt;br&gt;&lt;strong&gt;β / θ&lt;sub&gt;E&lt;/sub&gt; = ${beta.toFixed(2)}：&lt;/strong&gt;绿色源平面没有变，但源在其中横向移动并离开主光轴；像平面上出现两个不对称像。`;
      } else {
        status.innerHTML = `&lt;strong&gt;红移平面族：&lt;/strong&gt;灰色切片表示任意 z=常数 的距离层；橙色 zₗ=0.5 和绿色 zₛ=1.0 是两张特定切片。&lt;br&gt;&lt;strong&gt;β / θ&lt;sub&gt;E&lt;/sub&gt; = ${beta.toFixed(2)}：&lt;/strong&gt;源仍在绿色源平面，却已横向移到爱因斯坦半径尺度以外；简化模型只保留一个主要像。`;
      }
    }

    offsetValue.textContent = beta.toFixed(2);
  }

  function setCamera(position, target) {
    camera.position.copy(position);
    controls.target.copy(target);
    controls.update();
  }

  function saveState(view) {
    window.openai?.setWidgetState?.({
      modelContent: { sourceOffset: Number(offsetInput.value) },
      privateContent: { view }
    }).catch(() =&gt; {});
  }

  const saved = window.openai?.widgetState || {};
  const savedOffset = Number(saved.modelContent?.sourceOffset);
  if (Number.isFinite(savedOffset) &amp;&amp; savedOffset &gt;= 0 &amp;&amp; savedOffset &lt;= 1.25) {
    offsetInput.value = String(savedOffset);
  }

  const views = {
    perspective: () =&gt; setCamera(new THREE.Vector3(9.5, 6.4, -5.8), new THREE.Vector3(0, 0, 5.0)),
    side: () =&gt; setCamera(new THREE.Vector3(11.5, 0.2, 5.0), new THREE.Vector3(0, 0, 5.0)),
    observer: () =&gt; setCamera(new THREE.Vector3(0.01, 0.01, -3.8), new THREE.Vector3(0, 0, 5.2))
  };

  document.getElementById(&quot;lp3d-perspective&quot;).addEventListener(&quot;click&quot;, () =&gt; { views.perspective(); saveState(&quot;perspective&quot;); });
  document.getElementById(&quot;lp3d-side&quot;).addEventListener(&quot;click&quot;, () =&gt; { views.side(); saveState(&quot;side&quot;); });
  document.getElementById(&quot;lp3d-observer&quot;).addEventListener(&quot;click&quot;, () =&gt; { views.observer(); saveState(&quot;observer&quot;); });

  offsetInput.addEventListener(&quot;input&quot;, () =&gt; updateGeometry(Number(offsetInput.value)));
  offsetInput.addEventListener(&quot;change&quot;, () =&gt; saveState(saved.privateContent?.view || &quot;perspective&quot;));

  function resize() {
    const width = Math.max(stage.clientWidth, 320);
    const height = Math.max(stage.clientHeight, 420);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }

  new ResizeObserver(resize).observe(stage);
  window.addEventListener(&quot;openai:set_globals&quot;, (event) =&gt; {
    const next = event.detail?.globals?.widgetState;
    const nextOffset = Number(next?.modelContent?.sourceOffset);
    if (Number.isFinite(nextOffset)) {
      offsetInput.value = String(nextOffset);
      updateGeometry(nextOffset);
    }
  });

  const initialView = saved.privateContent?.view;
  (views[initialView] || views.perspective)();
  updateGeometry(Number(offsetInput.value));
  resize();

  function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  let currentLanguage = &quot;en&quot;;

  function normalizeLanguage(value) {
    return String(value || &quot;&quot;).toLowerCase().startsWith(&quot;en&quot;) ? &quot;en&quot; : &quot;zh&quot;;
  }

  function t(key, values = {}) {
    let text = COPY[currentLanguage]?.[key] ?? COPY.zh[key] ?? key;
    Object.entries(values).forEach(([name, value]) =&gt; {
      text = text.replaceAll(`{${name}}`, String(value));
    });
    return text;
  }

  const palette = {
    axis: 0x667085,
    plane: 0x98a2b3,
    image: 0xc13b80,
    lens: 0xd66a1f,
    source: 0x168a52,
    ray: 0x2478c9,
    rayHot: 0x1f2937,
    straight: 0x168f88,
    extension: 0x7654c4,
    shear: 0x7b3fa1,
    slice: 0x3568d4,
    white: 0x344054
  };

  const OBSERVER_Z = 0;
  const IMAGE_Z = 1.35;
  // World-z is a visual distance proxy. The defaults preserve the original
  // teaching layout (zₗ=0.5 -> 5, zₛ=1.0 -> 10); sidebar redshift controls
  // now move both physical planes together.
  let LENS_Z = 5;
  let SOURCE_Z = 10;
  const BETA_SCALE = 1.48;
  const PLANE_SIZE = 6.3;
  const lensParameters = {
    massModel: &quot;isothermal_sph&quot;,
    lensRedshift: 0.50,
    sourceRedshift: 1.00,
    lensX: 0,
    lensY: 0,
    massAxisRatio: 1,
    massAngle: 0,
    shearGamma1: 0,
    shearGamma2: 0,
    einsteinRadius: 1,
    sourceModel: &quot;sersic&quot;,
    sourceIntensity: 1,
    sourceEffectiveRadius: 0.10,
    sourceSersicIndex: 1,
    sourceAxisRatio: 0.82,
    sourceAngle: 25,
    lensLightEnabled: true,
    lensLightIntensity: 0.28,
    lensLightEffectiveRadius: 0.58,
    lensLightSersicIndex: 2.4,
    lensLightAxisRatio: 0.76,
    lensLightAngle: 8
  };

  function finiteNumber(value, fallback) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }

  function currentEinsteinRadius() {
    return THREE.MathUtils.clamp(finiteNumber(lensParameters.einsteinRadius, 1), 0.05, 3);
  }

  function currentAxisRatio() {
    return THREE.MathUtils.clamp(finiteNumber(lensParameters.massAxisRatio, 1), 0.2, 1);
  }

  function currentDeflectionAxisRatio() {
    return lensParameters.massModel === &quot;isothermal_sph&quot; ? 1 : currentAxisRatio();
  }

  function currentSourceEffectiveRadius() {
    return THREE.MathUtils.clamp(finiteNumber(lensParameters.sourceEffectiveRadius, 0.10), 0.005, 0.5);
  }

  function currentSourceAxisRatio() {
    return THREE.MathUtils.clamp(finiteNumber(lensParameters.sourceAxisRatio, 0.82), 0.2, 1);
  }

  function currentLensLightAxisRatio() {
    return THREE.MathUtils.clamp(finiteNumber(lensParameters.lensLightAxisRatio, 0.76), 0.2, 1);
  }

  function sourceIsPoint() {
    return lensParameters.sourceModel === &quot;point&quot;;
  }

  function currentShearComponents() {
    return {
      gamma1: finiteNumber(lensParameters.shearGamma1, 0),
      gamma2: finiteNumber(lensParameters.shearGamma2, 0)
    };
  }

  function currentShear() {
    const { gamma1, gamma2 } = currentShearComponents();
    return Math.hypot(gamma1, gamma2);
  }

  function currentShearAngle() {
    const { gamma1, gamma2 } = currentShearComponents();
    return 0.5 * Math.atan2(gamma2, gamma1) * 180 / Math.PI;
  }

  function hasShearModel() {
    return currentShear() &gt; 0.0001 || /shear/i.test(lensParameters.massModel);
  }

  function applyIncomingModel(model, globals = {}) {
    if (!model || typeof model !== &quot;object&quot;) return false;
    const incomingLensRedshift = Number(model.lensRedshift);
    const incomingSourceRedshift = Number(model.sourceRedshift);
    if (Number.isFinite(incomingLensRedshift)) {
      lensParameters.lensRedshift = THREE.MathUtils.clamp(incomingLensRedshift, 0.05, 5.9);
    }
    if (Number.isFinite(incomingSourceRedshift)) {
      lensParameters.sourceRedshift = THREE.MathUtils.clamp(
        incomingSourceRedshift,
        Math.max(0.1, lensParameters.lensRedshift + 0.05),
        6
      );
    }
    if (Number.isFinite(Number(model.lensX))) lensParameters.lensX = THREE.MathUtils.clamp(Number(model.lensX), -1.5, 1.5);
    if (Number.isFinite(Number(model.lensY))) lensParameters.lensY = THREE.MathUtils.clamp(Number(model.lensY), -1.5, 1.5);
    if (typeof model.massModel === &quot;string&quot; &amp;&amp; model.massModel.trim()) {
      lensParameters.massModel = model.massModel.trim();
    } else if (model.lensModel === &quot;cross&quot;) {
      lensParameters.massModel = &quot;isothermal_shear&quot;;
    } else if (model.lensModel === &quot;point&quot;) {
      lensParameters.massModel = &quot;isothermal_sph&quot;;
    }
    lensParameters.massAxisRatio = THREE.MathUtils.clamp(
      finiteNumber(model.massAxisRatio, lensParameters.massAxisRatio),
      0.2,
      1
    );
    lensParameters.massAngle = finiteNumber(model.massAngle, lensParameters.massAngle);
    lensParameters.einsteinRadius = THREE.MathUtils.clamp(
      finiteNumber(model.einsteinRadius, lensParameters.einsteinRadius),
      0.05,
      3
    );

    if (model.sourceModel === &quot;point&quot; || model.sourceModel === &quot;sersic&quot;) {
      lensParameters.sourceModel = model.sourceModel;
    }
    lensParameters.sourceIntensity = THREE.MathUtils.clamp(
      finiteNumber(model.sourceIntensity, lensParameters.sourceIntensity),
      0,
      10
    );
    lensParameters.sourceEffectiveRadius = THREE.MathUtils.clamp(
      finiteNumber(model.sourceEffectiveRadius, lensParameters.sourceEffectiveRadius),
      0.005,
      0.5
    );
    lensParameters.sourceSersicIndex = THREE.MathUtils.clamp(
      finiteNumber(model.sourceSersicIndex, lensParameters.sourceSersicIndex),
      0.3,
      8
    );
    lensParameters.sourceAxisRatio = THREE.MathUtils.clamp(
      finiteNumber(model.sourceAxisRatio, lensParameters.sourceAxisRatio),
      0.2,
      1
    );
    lensParameters.sourceAngle = finiteNumber(model.sourceAngle, lensParameters.sourceAngle);

    if (typeof model.lensLightEnabled === &quot;boolean&quot;) {
      lensParameters.lensLightEnabled = model.lensLightEnabled;
    }
    lensParameters.lensLightIntensity = THREE.MathUtils.clamp(
      finiteNumber(model.lensLightIntensity, lensParameters.lensLightIntensity),
      0,
      10
    );
    lensParameters.lensLightEffectiveRadius = THREE.MathUtils.clamp(
      finiteNumber(model.lensLightEffectiveRadius, lensParameters.lensLightEffectiveRadius),
      0.005,
      3
    );
    lensParameters.lensLightSersicIndex = THREE.MathUtils.clamp(
      finiteNumber(model.lensLightSersicIndex, lensParameters.lensLightSersicIndex),
      0.3,
      8
    );
    lensParameters.lensLightAxisRatio = THREE.MathUtils.clamp(
      finiteNumber(model.lensLightAxisRatio, lensParameters.lensLightAxisRatio),
      0.2,
      1
    );
    lensParameters.lensLightAngle = finiteNumber(model.lensLightAngle, lensParameters.lensLightAngle);

    const hasGammaComponents = Number.isFinite(Number(model.shearGamma1)) || Number.isFinite(Number(model.shearGamma2));
    if (hasGammaComponents) {
      lensParameters.shearGamma1 = finiteNumber(model.shearGamma1, lensParameters.shearGamma1);
      lensParameters.shearGamma2 = finiteNumber(model.shearGamma2, lensParameters.shearGamma2);
    } else if (Number.isFinite(Number(model.externalShear))) {
      const magnitude = Math.max(0, Number(model.externalShear));
      const angle = Number.isFinite(Number(model.shearAngle)) ? Number(model.shearAngle) * Math.PI / 180 : 0;
      lensParameters.shearGamma1 = magnitude * Math.cos(2 * angle);
      lensParameters.shearGamma2 = magnitude * Math.sin(2 * angle);
    }

    const language = model.language ?? globals.language;
    const nextLanguage = normalizeLanguage(language || currentLanguage);
    const languageChanged = nextLanguage !== currentLanguage;
    currentLanguage = nextLanguage;
    lensModelInput.value = hasShearModel() ? &quot;cross&quot; : &quot;point&quot;;
    shearInput.value = String(currentShear());
    if (typeof updatePhysicalPlanePositions === &quot;function&quot;) updatePhysicalPlanePositions();
    return languageChanged;
  }

  // The observer camera looks from -z toward +z, which reverses Three.js world-x
  // on screen. Store angular +x as world -x so the displayed image follows the
  // PyAutoLens convention: positive beta_x and theta_x appear on screen-right.
  function displayX(angleX, scale = BETA_SCALE) {
    return -angleX * scale;
  }

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

  const world = new THREE.Group();
  scene.add(world);
  const rayGroup = new THREE.Group();
  const imageGroup = new THREE.Group();
  const annotationGroup = new THREE.Group();
  const photonGroup = new THREE.Group();

  // The teaching space intentionally keeps a plain white background.

  function planeAt(z, color, opacity) {
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE),
      new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    mesh.position.z = z;
    planeGroup.add(mesh);
    const grid = new THREE.GridHelper(PLANE_SIZE, 12, color, color);
    grid.rotation.x = Math.PI / 2;
    grid.position.z = z + 0.005;
    grid.material.transparent = true;
    grid.material.opacity = opacity * 1.9;
    grid.material.depthWrite = false;
    mesh.userData.grid = grid;
    planeGroup.add(grid);
    return mesh;
  }

  const imagePlane = planeAt(IMAGE_Z, palette.image, 0.045);
  const lensPlane = planeAt(LENS_Z, palette.lens, 0.055);
  const sourcePlane = planeAt(SOURCE_Z, palette.source, 0.05);
  sourcePlane.userData.sourcePlane = true;

  function redshiftToWorldZ(redshift) {
    const z = THREE.MathUtils.clamp(finiteNumber(redshift, 1), 0.05, 6);
    // Keep the familiar default layout while retaining a monotonic distance
    // cue across the supported redshift range. Values above z=1 are spread
    // more gently so the source plane remains inside the teaching viewport.
    return z <= 1 ? Math.max(IMAGE_Z + 0.65, 10 * z) : 10 + 1.2 * (z - 1);
  }

  function updatePhysicalPlanePositions() {
    const requestedLensZ = redshiftToWorldZ(lensParameters.lensRedshift);
    const requestedSourceZ = redshiftToWorldZ(lensParameters.sourceRedshift);
    LENS_Z = Math.max(IMAGE_Z + 0.65, requestedLensZ);
    SOURCE_Z = Math.max(LENS_Z + 0.9, requestedSourceZ);
    lensPlane.position.z = LENS_Z;
    lensPlane.userData.grid.position.z = LENS_Z + 0.005;
    sourcePlane.position.z = SOURCE_Z;
    sourcePlane.userData.grid.position.z = SOURCE_Z + 0.005;
    lensGalaxy.position.z = LENS_Z;
    sourceGalaxy.position.z = SOURCE_Z + 0.05;
    if (typeof dragPlane !== &quot;undefined&quot;) dragPlane.constant = -SOURCE_Z;
    if (typeof axis !== &quot;undefined&quot;) axis.scale.z = Math.max(1, SOURCE_Z / 11.2);
    root.dataset.lensRedshift = String(finiteNumber(lensParameters.lensRedshift, 0.5));
    root.dataset.sourceRedshift = String(finiteNumber(lensParameters.sourceRedshift, 1.0));
    root.dataset.lensPlaneZ = String(LENS_Z);
    root.dataset.sourcePlaneZ = String(SOURCE_Z);
    if (typeof refreshFixedLabels === &quot;function&quot;) refreshFixedLabels();
  }

  function makeLabel(text, color = &quot;#f5f8ff&quot;, width = 3.7, height = 0.5) {
    const canvas = document.createElement(&quot;canvas&quot;);
    canvas.width = 1024;
    canvas.height = 144;
    const context = canvas.getContext(&quot;2d&quot;);
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.font = &quot;500 45px 'Segoe UI', 'Microsoft YaHei', sans-serif&quot;;
    context.fillStyle = color;
    context.textAlign = &quot;center&quot;;
    context.textBaseline = &quot;middle&quot;;
    context.shadowColor = &quot;rgba(255,255,255,0.96)&quot;;
    context.shadowBlur = 5;
    context.fillText(text, canvas.width / 2, canvas.height / 2);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    const sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false, depthWrite: false })
    );
    sprite.scale.set(width, height, 1);
    sprite.renderOrder = 50;
    return sprite;
  }

  function addFixedLabel(text, position, color, width) {
    const label = makeLabel(text, color, width);
    label.position.copy(position);
    fixedLabelGroup.add(label);
    return label;

  const fixedLabelGroup = new THREE.Group();
  world.add(fixedLabelGroup);

    addFixedLabel(t(&quot;imagePlaneLabel&quot;), new THREE.Vector3(0, 3.35, IMAGE_Z), &quot;#a52f6c&quot;, 2.8);
    addFixedLabel(t(&quot;lensPlaneLabel&quot;, { z: finiteNumber(lensParameters.lensRedshift, 0.5).toFixed(2) }), new THREE.Vector3(0, 3.35, LENS_Z), &quot;#b85216&quot;, 3.2);
    addFixedLabel(t(&quot;sourcePlaneLabel&quot;, { z: finiteNumber(lensParameters.sourceRedshift, 1.0).toFixed(2) }), new THREE.Vector3(0, 3.35, SOURCE_Z), &quot;#117642&quot;, 3.0);

  function applyLayerVisibility() {

  function galaxyTexture(core, arms, seed) {
    const canvas = document.createElement(&quot;canvas&quot;);
    canvas.width = 512;
    canvas.height = 512;
    const context = canvas.getContext(&quot;2d&quot;);
    const gradient = context.createRadialGradient(256, 256, 4, 256, 256, 240);
    gradient.addColorStop(0, core);
    gradient.addColorStop(0.12, arms);
    gradient.addColorStop(0.55, &quot;rgba(80,110,180,0.15)&quot;);
    gradient.addColorStop(1, &quot;rgba(0,0,0,0)&quot;);
    context.fillStyle = gradient;
    context.fillRect(0, 0, 512, 512);
    const random = seededRandom(seed);
    for (let index = 0; index &lt; 520; index += 1) {
      const arm = index % 3;
      const radius = Math.pow(random(), 0.7) * 205;
      const angle = arm * Math.PI * 2 / 3 + radius * 0.032 + (random() - 0.5) * 0.55;
      const x = 256 + Math.cos(angle) * radius;
      const y = 256 + Math.sin(angle) * radius * 0.58;
      const size = 0.5 + random() * 2.2;
      context.fillStyle = index % 7 === 0 ? core : arms;
      context.globalAlpha = 0.16 + random() * 0.62;
      context.beginPath();
      context.arc(x, y, size, 0, Math.PI * 2);
      context.fill();
    }
    context.globalAlpha = 1;
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  const lensGalaxy = new THREE.Group();
  lensGalaxy.position.z = LENS_Z;
  const lensBody = new THREE.Mesh(
    new THREE.SphereGeometry(0.62, 48, 30),
    new THREE.MeshBasicMaterial({ color: 0x8b9099, transparent: true, opacity: 0.86 })
  );
  lensBody.scale.set(0.94, 0.94, 0.3);
  lensGalaxy.add(lensBody);
  world.add(lensGalaxy);

  function ellipseLoop(radiusX, radiusY, z, color, opacity, rotation = 0) {
    const points = [];
    for (let index = 0; index &lt; 160; index += 1) {
      const angle = 2 * Math.PI * index / 160;
      points.push(new THREE.Vector3(radiusX * Math.cos(angle), radiusY * Math.sin(angle), z));
    }
    const loop = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
    );
    loop.rotation.z = rotation;
    return loop;
  }

  function addShearArrow(direction, origin, length) {
    const arrow = new THREE.ArrowHelper(direction, origin, length, palette.shear, 0.17, 0.09);
    arrow.line.material.transparent = true;
    arrow.line.material.opacity = 0.86;
    arrow.cone.material.transparent = true;
    arrow.cone.material.opacity = 0.86;
    lensFieldGroup.add(arrow);
  }

  let lensVisualKey = &quot;&quot;;

  function updateLensModelVisuals() {
    const isCross = hasShearModel();
    const shear = currentShear();
    const { gamma1, gamma2 } = currentShearComponents();
    const shearAngle = currentShearAngle();
    const axisRatio = currentAxisRatio();
    const massAngle = finiteNumber(lensParameters.massAngle, 0);
    const einsteinRadius = currentEinsteinRadius();
    const normalized = THREE.MathUtils.clamp(shear / 0.30, 0, 1);
    const contourColor = isCross ? palette.shear : palette.lens;

    lensGalaxy.position.set(
      displayX(finiteNumber(lensParameters.lensX, 0)),
      finiteNumber(lensParameters.lensY, 0) * BETA_SCALE,
      LENS_Z
    );
    lensFieldGroup.position.set(
      displayX(finiteNumber(lensParameters.lensX, 0)),
      finiteNumber(lensParameters.lensY, 0) * BETA_SCALE,
      0
    );

    shearInput.disabled = !isCross;
    shearControl.classList.toggle(&quot;is-disabled&quot;, !isCross);
    shearValue.textContent = shear.toFixed(2);
    modelExplanation.innerHTML = isCross
      ? shear &lt; 0.01
        ? t(&quot;modelShearZero&quot;)
        : t(&quot;modelShear&quot;, { gamma: shear.toFixed(2), angle: shearAngle.toFixed(1) })
      : axisRatio &lt; 0.995
        ? t(&quot;modelElliptical&quot;, { q: axisRatio.toFixed(2), angle: massAngle.toFixed(1) })
        : t(&quot;modelAxisymmetric&quot;);

    const nextVisualKey = [
      lensParameters.massModel,
      axisRatio.toFixed(3),
      massAngle.toFixed(2),
      gamma1.toFixed(4),
      gamma2.toFixed(4),
      einsteinRadius.toFixed(3),
      currentLanguage
    ].join(&quot;:&quot;);
    if (nextVisualKey === lensVisualKey) return;
    lensVisualKey = nextVisualKey;
    clearGroup(lensFieldGroup);

    // Preserve the full mass-model orientation in the 3D representation. The
    // red browser panel uses the same q / PA / shear inputs in a fast
    // elliptical approximation; the adjacent blue panel remains the exact
    // PyAutoLens result.
    lensBody.scale.set(0.94, 0.94 * axisRatio, 0.3);
    lensBody.rotation.z = THREE.MathUtils.degToRad(massAngle);
    [0.86, 1.18, 1.5].forEach((radius, index) =&gt; {
      const ellipticityStretch = 1 / Math.sqrt(axisRatio);
      const ellipticitySqueeze = Math.sqrt(axisRatio);
      const stretch = ellipticityStretch * (1 + normalized * (0.18 + index * 0.035));
      const squeeze = ellipticitySqueeze * (1 - normalized * (0.13 + index * 0.025));
      const contourAngle = THREE.MathUtils.degToRad(isCross ? shearAngle : massAngle);
      lensFieldGroup.add(ellipseLoop(
        radius * einsteinRadius * stretch,
        radius * einsteinRadius * squeeze,
        LENS_Z + 0.035 + index * 0.004,
        contourColor,
        0.22 + index * 0.035,
        contourAngle
      ));
    });

    if (isCross &amp;&amp; shear &gt; 0.001) {
      const arrowLength = 0.26 + normalized * 0.38;
      const phi = THREE.MathUtils.degToRad(shearAngle);
      const major = new THREE.Vector3(Math.cos(phi), Math.sin(phi), 0);
      const minor = new THREE.Vector3(-Math.sin(phi), Math.cos(phi), 0);
      addShearArrow(major, major.clone().multiplyScalar(1.62).setZ(LENS_Z + 0.08), arrowLength);
      addShearArrow(major.clone().negate(), major.clone().multiplyScalar(-1.62).setZ(LENS_Z + 0.08), arrowLength);
      addShearArrow(minor.clone().negate(), minor.clone().multiplyScalar(2.05).setZ(LENS_Z + 0.08), arrowLength);
      addShearArrow(minor, minor.clone().multiplyScalar(-2.05).setZ(LENS_Z + 0.08), arrowLength);
    }

    const labelText = isCross || axisRatio &lt; 0.995 || lensParameters.massModel !== &quot;isothermal_sph&quot;
      ? t(&quot;lensPotentialDetailed&quot;, {
          model: lensParameters.massModel,
          q: axisRatio.toFixed(2),
          angle: massAngle.toFixed(1),
          thetaE: einsteinRadius.toFixed(2),
          gamma: shear.toFixed(2),
          shearAngle: shearAngle.toFixed(1)
        })
      : t(&quot;lensPotentialAxisymmetric&quot;, { thetaE: einsteinRadius.toFixed(2) });
    const label = makeLabel(labelText, &quot;#111111&quot;, 4.7, 0.46);
    label.position.set(0, -2.22, LENS_Z + 0.12);
    lensFieldGroup.add(label);

  }

  const sourceGalaxy = new THREE.Group();
  sourceGalaxy.position.z = SOURCE_Z + 0.05;
  const sourceSprite = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 40, 24),
    new THREE.MeshBasicMaterial({ color: palette.source, transparent: true, opacity: 0.86 })
  );
  sourceSprite.scale.set(1.22, 0.78, 0.38);
  const sourceHit = new THREE.Mesh(
    new THREE.SphereGeometry(0.58, 18, 12),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  sourceGalaxy.add(sourceSprite, sourceHit);
  world.add(sourceGalaxy);

  function clearGroup(group) {
    while (group.children.length) {
      const item = group.children.pop();
      item.traverse?.((child) =&gt; {
        child.geometry?.dispose?.();
        if (Array.isArray(child.material)) {
          child.material.forEach((material) =&gt; {
            material.map?.dispose?.();
            material.dispose?.();
          });
        } else {
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        }
      });
    }
  }

  function lensSolutions(betaX, betaY, fallbackAngle = 0) {
    const beta = Math.hypot(betaX, betaY);
    const directionX = beta &gt; 0.0001 ? betaX / beta : Math.cos(fallbackAngle);
    const directionY = beta &gt; 0.0001 ? betaY / beta : Math.sin(fallbackAngle);
    const einsteinRadius = currentEinsteinRadius();
    const solutions = [
      {
        x: (beta + einsteinRadius) * directionX,
        y: (beta + einsteinRadius) * directionY,
        parity: 1
      }
    ];
    if (beta &lt; einsteinRadius) {
      const innerRadius = einsteinRadius - beta;
      solutions.push({
        x: -innerRadius * directionX,
        y: -innerRadius * directionY,
        parity: -1
      });
    }
    return solutions;
  }

  function approximateLensMap(thetaX, thetaY) {
    const einsteinRadius = currentEinsteinRadius();
    const axisRatio = currentDeflectionAxisRatio();
    const angle = THREE.MathUtils.degToRad(finiteNumber(lensParameters.massAngle, 0));
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    const rotatedX = thetaX * cosine + thetaY * sine;
    const rotatedY = -thetaX * sine + thetaY * cosine;
    const ellipticalRadius = Math.sqrt(
      axisRatio * rotatedX * rotatedX + rotatedY * rotatedY / axisRatio + 0.000001
    );
    const alphaRotatedX = einsteinRadius * axisRatio * rotatedX / ellipticalRadius;
    const alphaRotatedY = einsteinRadius * rotatedY / axisRatio / ellipticalRadius;
    let alphaX = alphaRotatedX * cosine - alphaRotatedY * sine;
    let alphaY = alphaRotatedX * sine + alphaRotatedY * cosine;
    const { gamma1, gamma2 } = currentShearComponents();
    alphaX += gamma1 * thetaX + gamma2 * thetaY;
    alphaY += gamma2 * thetaX - gamma1 * thetaY;
    return { x: thetaX - alphaX, y: thetaY - alphaY };
  }

  function requiresNumericalLensSolutions() {
    return currentDeflectionAxisRatio() &lt; 0.995 || currentShear() &gt; 0.0001;
  }

  function numericalLensSolutions(betaX, betaY) {
    const einsteinRadius = currentEinsteinRadius();
    const solutions = [];
    const sourceRadius = Math.hypot(betaX, betaY);
    const seedRadii = [0.24, 0.48, 0.74, 1.0, 1.28, 1.7]
      .map((radius) =&gt; radius * einsteinRadius)
      .concat([sourceRadius + einsteinRadius]);
    const finiteDifference = Math.max(0.00001, einsteinRadius * 0.00008);
    const maximumStep = Math.max(0.12, einsteinRadius * 0.42);

    for (let angleIndex = 0; angleIndex &lt; 28; angleIndex += 1) {
      const angle = 2 * Math.PI * angleIndex / 28;
      for (const seedRadius of seedRadii) {
        let x = seedRadius * Math.cos(angle);
        let y = seedRadius * Math.sin(angle);

        for (let iteration = 0; iteration &lt; 24; iteration += 1) {
          const mapped = approximateLensMap(x, y);
          const fx = mapped.x - betaX;
          const fy = mapped.y - betaY;
          const plusX = approximateLensMap(x + finiteDifference, y);
          const minusX = approximateLensMap(x - finiteDifference, y);
          const plusY = approximateLensMap(x, y + finiteDifference);
          const minusY = approximateLensMap(x, y - finiteDifference);
          const denominator = 2 * finiteDifference;
          const jxx = (plusX.x - minusX.x) / denominator;
          const jyx = (plusX.y - minusX.y) / denominator;
          const jxy = (plusY.x - minusY.x) / denominator;
          const jyy = (plusY.y - minusY.y) / denominator;
          const determinant = jxx * jyy - jxy * jyx;
          if (!Number.isFinite(determinant) || Math.abs(determinant) &lt; 0.00000001) break;
          const deltaX = (jyy * fx - jxy * fy) / determinant;
          const deltaY = (-jyx * fx + jxx * fy) / determinant;
          const stepLength = Math.hypot(deltaX, deltaY);
          const damping = stepLength &gt; maximumStep ? maximumStep / stepLength : 1;
          x -= deltaX * damping;
          y -= deltaY * damping;
          if (stepLength * damping &lt; 0.000008) break;
        }

        const mapped = approximateLensMap(x, y);
        const residual = Math.hypot(mapped.x - betaX, mapped.y - betaY);
        if (
          !Number.isFinite(residual) ||
          residual &gt; 0.0008 ||
          Math.hypot(x, y) &lt; 0.02 * einsteinRadius ||
          Math.hypot(x, y) &gt; Math.max(3, 3.2 * einsteinRadius + sourceRadius)
        ) continue;
        const duplicateDistance = Math.max(0.002, 0.0025 * einsteinRadius);
        if (solutions.some((solution) =&gt; Math.hypot(solution.x - x, solution.y - y) &lt; duplicateDistance)) continue;
        solutions.push({ x, y, parity: 0 });
      }
    }

    return solutions.sort((left, right) =&gt; Math.atan2(left.y, left.x) - Math.atan2(right.y, right.x));
  }

  function currentLensSolutions(betaX, betaY, fallbackAngle = 0) {
    return requiresNumericalLensSolutions()
      ? numericalLensSolutions(betaX, betaY)
      : lensSolutions(betaX, betaY, fallbackAngle);
  }

  function ellipticalLightRadius(x, y, centerX, centerY, axisRatio, angleDegrees) {
    const angle = THREE.MathUtils.degToRad(angleDegrees);
    const deltaX = x - centerX;
    const deltaY = y - centerY;
    const major = deltaX * Math.cos(angle) + deltaY * Math.sin(angle);
    const minor = -deltaX * Math.sin(angle) + deltaY * Math.cos(angle);
    return Math.sqrt(major * major + (minor / Math.max(axisRatio, 0.2)) ** 2);
  }

  function sersicBrightness(radius, effectiveRadius, sersicIndex, intensity) {
    const index = THREE.MathUtils.clamp(finiteNumber(sersicIndex, 1), 0.3, 8);
    const radiusScale = Math.max(finiteNumber(effectiveRadius, 0.1), 0.001);
    const coefficient = Math.max(0.6, 1.9992 * index - 0.3271);
    return Math.max(0, finiteNumber(intensity, 1)) * Math.exp(
      -coefficient * ((Math.max(radius, 0.000001) / radiusScale) ** (1 / index) - 1)
    );
  }

  function sourceSamplingRadius() {
    return sourceIsPoint()
      ? THREE.MathUtils.clamp(currentSourceEffectiveRadius() * 2.2, 0.025, 0.07)
      : THREE.MathUtils.clamp(currentSourceEffectiveRadius() * 1.45, 0.035, 0.28);
  }

  function sourceOffset(radius, angle) {
    const orientation = THREE.MathUtils.degToRad(finiteNumber(lensParameters.sourceAngle, 0));
    const major = radius * Math.cos(angle);
    const minor = radius * currentSourceAxisRatio() * Math.sin(angle);
    return {
      x: major * Math.cos(orientation) - minor * Math.sin(orientation),
      y: major * Math.sin(orientation) + minor * Math.cos(orientation)
    };
  }

  function renderSyntheticObservation(betaX, betaY, centralSolutions) {
    const beta = Math.hypot(betaX, betaY);
    const isCross = hasShearModel();
    const shear = currentShear();
    const einsteinRadius = currentEinsteinRadius();
    let special = null;

    if (isCross &amp;&amp; shear &lt; 0.005 &amp;&amp; beta &lt; 0.055 * einsteinRadius) {
      special = {
        title: t(&quot;shearRingTitle&quot;),
        caption: t(&quot;shearRingCaption&quot;),
        asset: null,
        isKeyframe: false
      };
    } else if (isCross &amp;&amp; centralSolutions.length === 4 &amp;&amp; beta &lt; 0.22 * einsteinRadius) {
      special = {
        title: t(&quot;crossTitle&quot;),
        caption: t(&quot;crossCaption&quot;),
        asset: null,
        isKeyframe: false
      };
    } else if (!isCross &amp;&amp; beta &lt; 0.055 * einsteinRadius) {
      special = {
        title: t(&quot;ringTitle&quot;),
        caption: t(&quot;ringCaption&quot;),
        asset: null,
        isKeyframe: false
      };
    } else if (!isCross &amp;&amp; Math.abs(beta - 0.244 * einsteinRadius) &lt; 0.045 * einsteinRadius) {
      special = {
        title: t(&quot;arcTitle&quot;),
        caption: t(&quot;arcCaption&quot;),
        asset: null,
        isKeyframe: false
      };
    }

    if (!special) {
      special = {
        title: isCross ? t(&quot;liveShearTitle&quot;) : t(&quot;liveSisTitle&quot;),
        caption: isCross ? t(&quot;liveShearCaption&quot;) : t(&quot;liveSisCaption&quot;),
        asset: null,
        isKeyframe: false
      };
    }

    observationPanel.hidden = false;
    visualRow.classList.add(&quot;has-observation&quot;);
    observationTitle.textContent = t(&quot;browserTitlePrefix&quot;) + special.title;
    observationImage.hidden = true;
    observationCanvas.hidden = false;
    const lensLightDescription = lensParameters.lensLightEnabled
      ? t(&quot;lensLightNote&quot;)
      : t(&quot;lensLightDisabledNote&quot;);
    observationCaption.textContent = special.caption + lensLightDescription + t(&quot;continuousNote&quot;);
    observationImage.onerror = () =&gt; {
      observationImage.hidden = true;
      observationCanvas.hidden = false;
      observationCaption.textContent = special.caption + t(&quot;fallbackNote&quot;);
    };

    const context = observationCanvas.getContext(&quot;2d&quot;);
    const width = observationCanvas.width;
    const height = observationCanvas.height;
    const imageData = context.createImageData(width, height);
    const thetaLimit = Math.max(
      1.75,
      einsteinRadius * 1.55 + beta * 0.3 + currentSourceEffectiveRadius()
    );
    const sourceAxisRatio = currentSourceAxisRatio();
    const sourceAngle = finiteNumber(lensParameters.sourceAngle, 0);
    const sourceIntensity = Math.max(0, finiteNumber(lensParameters.sourceIntensity, 1));
    const sourceSersicIndex = finiteNumber(lensParameters.sourceSersicIndex, 1);
    const lensLightAxisRatio = currentLensLightAxisRatio();
    const lensLightAngle = finiteNumber(lensParameters.lensLightAngle, 0);
    const lensLightIntensity = Math.max(0, finiteNumber(lensParameters.lensLightIntensity, 0.28));
    const lensLightEffectiveRadius = THREE.MathUtils.clamp(
      finiteNumber(lensParameters.lensLightEffectiveRadius, 0.58),
      0.005,
      3
    );
    const lensLightSersicIndex = finiteNumber(lensParameters.lensLightSersicIndex, 2.4);

    for (let pixelY = 0; pixelY &lt; height; pixelY += 1) {
      const thetaY = thetaLimit * (1 - 2 * pixelY / (height - 1));
      for (let pixelX = 0; pixelX &lt; width; pixelX += 1) {
        const thetaX = thetaLimit * (2 * pixelX / (width - 1) - 1);
        const mapped = approximateLensMap(thetaX, thetaY);
        const sourceRadius = ellipticalLightRadius(
          mapped.x,
          mapped.y,
          betaX,
          betaY,
          sourceAxisRatio,
          sourceAngle
        );
        const pointSigma = Math.max(currentSourceEffectiveRadius(), 0.018);
        const lensedLight = sourceIsPoint()
          ? sourceIntensity * Math.exp(-0.5 * (sourceRadius / pointSigma) ** 2)
          : sersicBrightness(
              sourceRadius,
              currentSourceEffectiveRadius(),
              sourceSersicIndex,
              sourceIntensity
            );
        const lensRadius = ellipticalLightRadius(
          thetaX,
          thetaY,
          0,
          0,
          lensLightAxisRatio,
          lensLightAngle
        );
        const lensLight = lensParameters.lensLightEnabled
          ? sersicBrightness(
              lensRadius,
              lensLightEffectiveRadius,
              lensLightSersicIndex,
              lensLightIntensity
            )
          : 0;
        const lensAlpha = Math.min(0.94, 1 - Math.exp(-0.46 * lensLight));
        const lensRed = 250 * (1 - lensAlpha) + 228 * lensAlpha;
        const lensGreen = 250 * (1 - lensAlpha) + 145 * lensAlpha;
        const lensBlue = 250 * (1 - lensAlpha) + 55 * lensAlpha;
        const imageStrength = Math.min(0.99, 1 - Math.exp(-0.78 * lensedLight));
        const offset = 4 * (pixelY * width + pixelX);
        imageData.data[offset] = Math.round(lensRed * (1 - imageStrength) + 190 * imageStrength);
        imageData.data[offset + 1] = Math.round(lensGreen * (1 - imageStrength) + 38 * imageStrength);
        imageData.data[offset + 2] = Math.round(lensBlue * (1 - imageStrength) + 104 * imageStrength);
        imageData.data[offset + 3] = 255;
      }
    }
    context.putImageData(imageData, 0, 0);
  }

  function rayCurve(sourcePoint, thetaPoint) {
    const observerPoint = new THREE.Vector3(0, 0, OBSERVER_Z);
    const lensPoint = new THREE.Vector3(
      displayX(finiteNumber(lensParameters.lensX, 0) + thetaPoint.x),
      (finiteNumber(lensParameters.lensY, 0) + thetaPoint.y) * BETA_SCALE,
      LENS_Z
    );
    const beforeLens = observerPoint.clone().lerp(lensPoint, (LENS_Z - 0.7) / LENS_Z);
    const afterLens = lensPoint.clone().lerp(sourcePoint, 0.7 / (SOURCE_Z - LENS_Z));
    return new THREE.CatmullRomCurve3(
      [observerPoint, beforeLens, lensPoint, afterLens, sourcePoint],
      false,
      &quot;centripetal&quot;,
      0.42
    );
  }

  function addDashed(points, color, opacity = 0.8) {
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineDashedMaterial({ color, dashSize: 0.16, gapSize: 0.11, transparent: true, opacity })
    );
    line.computeLineDistances();
    annotationGroup.add(line);
    return line;
  }

  function addSolid(points, color, opacity = 0.9) {
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color, transparent: true, opacity })
    );
    annotationGroup.add(line);
    return line;
  }

  function addImageMark(theta) {
    const scale = IMAGE_Z / LENS_Z;
    const lensX = finiteNumber(lensParameters.lensX, 0);
    const lensY = finiteNumber(lensParameters.lensY, 0);
    const mark = new THREE.Mesh(
      new THREE.SphereGeometry(0.085, 22, 14),
      new THREE.MeshBasicMaterial({ color: palette.image })
    );
    mark.position.set(
      displayX(lensX + theta.x, BETA_SCALE * scale),
      (lensY + theta.y) * BETA_SCALE * scale,
      IMAGE_Z + 0.035
    );
    imageGroup.add(mark);
  }

  function addLensedImage(betaX, betaY) {
    const sourceRadius = sourceSamplingRadius();
    const imageScale = IMAGE_Z / LENS_Z * BETA_SCALE;
    const lensX = finiteNumber(lensParameters.lensX, 0);
    const lensY = finiteNumber(lensParameters.lensY, 0);
    const positions = [];

    if (requiresNumericalLensSolutions()) {
      const gridSize = 190;
      const thetaLimit = Math.max(1.65, currentEinsteinRadius() * 1.75 + Math.hypot(betaX, betaY));
      for (let row = 0; row &lt; gridSize; row += 1) {
        const thetaY = -thetaLimit + 2 * thetaLimit * row / (gridSize - 1);
        for (let column = 0; column &lt; gridSize; column += 1) {
          const thetaX = -thetaLimit + 2 * thetaLimit * column / (gridSize - 1);
          const mapped = approximateLensMap(thetaX, thetaY);
          const mappedSourceRadius = ellipticalLightRadius(
            mapped.x,
            mapped.y,
            betaX,
            betaY,
            currentSourceAxisRatio(),
            finiteNumber(lensParameters.sourceAngle, 0)
          );
          if (mappedSourceRadius &lt;= sourceRadius) {
            positions.push(displayX(lensX + thetaX, imageScale), (lensY + thetaY) * imageScale, IMAGE_Z + 0.045);
          }
        }
      }
      const crossGeometry = new THREE.BufferGeometry();
      crossGeometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
      imageGroup.add(new THREE.Points(
        crossGeometry,
        new THREE.PointsMaterial({
          color: palette.image,
          size: 0.045,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.82,
          depthWrite: false
        })
      ));
      return;
    }

    const sampleCount = 1200;
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));

    for (let index = 0; index &lt; sampleCount; index += 1) {
      const radius = sourceRadius * Math.sqrt((index + 0.5) / sampleCount);
      const angle = index * goldenAngle;
      const offset = sourceOffset(radius, angle);
      const sampleX = betaX + offset.x;
      const sampleY = betaY + offset.y;
      lensSolutions(sampleX, sampleY, angle).forEach((theta) =&gt; {
        positions.push(displayX(lensX + theta.x, imageScale), (lensY + theta.y) * imageScale, IMAGE_Z + 0.045);
      });
    }

    const imageGeometry = new THREE.BufferGeometry();
    imageGeometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
    imageGroup.add(new THREE.Points(
      imageGeometry,
      new THREE.PointsMaterial({
        color: palette.image,
        size: 0.052,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.72,
        depthWrite: false
      })
    ));

    const boundaries = [[], []];
    const boundarySamples = 180;
    for (let index = 0; index &lt; boundarySamples; index += 1) {
      const angle = 2 * Math.PI * index / boundarySamples;
      const offset = sourceOffset(sourceRadius, angle);
      const sampleX = betaX + offset.x;
      const sampleY = betaY + offset.y;
      lensSolutions(sampleX, sampleY, angle).forEach((theta, branch) =&gt; {
        boundaries[branch].push(new THREE.Vector3(
          displayX(lensX + theta.x, imageScale),
          (lensY + theta.y) * imageScale,
          IMAGE_Z + 0.05
        ));
      });
    }

    boundaries.forEach((points) =&gt; {
      imageGroup.add(new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0x9f235f, transparent: true, opacity: 0.92 })
      ));
    });
  }

  function addAngleArc(origin, fromDirection, toDirection, radius, color, labelText) {
    const from = fromDirection.clone().normalize();
    const to = toDirection.clone().normalize();
    const dot = THREE.MathUtils.clamp(from.dot(to), -1, 1);
    const angle = Math.acos(dot);
    if (angle &lt; 0.004) {
      return;
    }
    const normal = new THREE.Vector3().crossVectors(from, to);
    if (normal.lengthSq() &lt; 0.000001) {
      return;
    }
    normal.normalize();
    const points = [];
    for (let index = 0; index &lt;= 30; index += 1) {
      points.push(
        from.clone().applyAxisAngle(normal, angle * index / 30).multiplyScalar(radius).add(origin)
      );
    }
    addSolid(points, color, 0.98);
    const middle = points[Math.floor(points.length / 2)].clone();
    const label = makeLabel(labelText, &quot;#111111&quot;, 2.85, 0.48);
    const outward = middle.clone().sub(origin).normalize().multiplyScalar(0.2);
    label.position.copy(middle.add(outward));
    annotationGroup.add(label);
  }

  function addDoubleArrow(startZ, endZ, y, labelText) {
    const x = -2.72;
    const middleZ = (startZ + endZ) / 2;
    const half = (endZ - startZ) / 2;
    const middle = new THREE.Vector3(x, y, middleZ);
    const forward = new THREE.ArrowHelper(
      new THREE.Vector3(0, 0, 1),
      middle,
      half,
      palette.white,
      0.16,
      0.08
    );
    const backward = new THREE.ArrowHelper(
      new THREE.Vector3(0, 0, -1),
      middle,
      half,
      palette.white,
      0.16,
      0.08
    );
    forward.line.material.transparent = true;
    forward.line.material.opacity = 0.62;
    backward.line.material.transparent = true;
    backward.line.material.opacity = 0.62;
    annotationGroup.add(forward, backward);
    const label = makeLabel(labelText, &quot;#111111&quot;, 2.4, 0.72);
    label.position.set(x - 0.2, y - 0.4, middleZ);
    annotationGroup.add(label);

  let activeCurves = [];

  function updateGeometry() {
    clearGroup(rayGroup);
    clearGroup(imageGroup);
    clearGroup(annotationGroup);
    clearGroup(photonGroup);
    activeCurves = [];

    const betaX = Number(xInput.value);
    const betaY = Number(yInput.value);
    const density = Number(densityInput.value);
    const lensX = finiteNumber(lensParameters.lensX, 0);
    const lensY = finiteNumber(lensParameters.lensY, 0);
    root.dataset.lensX = String(lensX);
    root.dataset.lensY = String(lensY);
    root.dataset.sourceBetaX = String(betaX);
    root.dataset.sourceBetaY = String(betaY);
    const beta = Math.hypot(betaX, betaY);
    updateLensModelVisuals();
    const sourceCenter = new THREE.Vector3(displayX(lensX + betaX), (lensY + betaY) * BETA_SCALE, SOURCE_Z);
    sourceGalaxy.position.set(sourceCenter.x, sourceCenter.y, SOURCE_Z + 0.05);
    const sourceVisualScale = THREE.MathUtils.clamp(currentSourceEffectiveRadius() / 0.10, 0.5, 1.8);
    sourceSprite.scale.set(
      1.22 * sourceVisualScale,
      1.22 * currentSourceAxisRatio() * sourceVisualScale,
      0.38 * sourceVisualScale
    );
    sourceSprite.rotation.z = THREE.MathUtils.degToRad(finiteNumber(lensParameters.sourceAngle, 0));

    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    const raySourceRadius = sourceSamplingRadius();
    for (let index = 0; index &lt; samples; index += 1) {
      const radius = raySourceRadius * Math.sqrt((index + 0.35) / samples);
      const angle = index * goldenAngle;
      const offset = sourceOffset(radius, angle);
      const sampleX = betaX + offset.x;
      const sampleY = betaY + offset.y;
      const sampleSource = new THREE.Vector3(displayX(lensX + sampleX), (lensY + sampleY) * BETA_SCALE, SOURCE_Z);
      const solutions = currentLensSolutions(sampleX, sampleY, angle);
      solutions.forEach((theta, solutionIndex) =&gt; {
        const curve = rayCurve(sampleSource, theta);
        activeCurves.push(curve);
        const points = curve.getPoints(72);
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({
            color: solutionIndex === 0 ? palette.ray : 0x5277ad,
            transparent: true,
            opacity: solutionIndex === 0 ? 0.5 : 0.32,
            depthWrite: false
          })

        rayGroup.add(line);
      });
    }

    let centralSolutions = currentLensSolutions(betaX, betaY, Math.PI / 6);
    if (centralSolutions.length === 0) centralSolutions = lensSolutions(betaX, betaY, Math.PI / 6);
    addLensedImage(betaX, betaY);
    renderSyntheticObservation(betaX, betaY, centralSolutions);
    const primary = centralSolutions[0];
    const primaryCurve = rayCurve(sourceCenter, primary);
    activeCurves.unshift(primaryCurve);
    rayGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(primaryCurve.getPoints(120)),
      new THREE.LineBasicMaterial({
        color: palette.rayHot,
        transparent: true,
        opacity: 0.92
      })
    ));

    const observerPoint = new THREE.Vector3(0, 0, OBSERVER_Z);
    const primaryImpact = new THREE.Vector3(displayX(lensX + primary.x), (lensY + primary.y) * BETA_SCALE, LENS_Z);
    const extensionEnd = primaryImpact.clone().multiplyScalar(SOURCE_Z / LENS_Z);
    extensionEnd.z = SOURCE_Z;

    addDashed([observerPoint, sourceCenter], palette.straight, 0.82);
    addDashed([observerPoint, extensionEnd], palette.extension, 0.78);

    const betaDirection = sourceCenter.clone().sub(observerPoint);
    const thetaDirection = primaryImpact.clone().sub(observerPoint);
    addAngleArc(observerPoint, new THREE.Vector3(0, 0, 1), betaDirection, 1.28, palette.straight, t(&quot;betaAngle&quot;));
    addAngleArc(observerPoint, new THREE.Vector3(0, 0, 1), thetaDirection, 1.9, palette.extension, t(&quot;thetaAngle&quot;));

    const incoming = primaryImpact.clone().sub(observerPoint).normalize();
    const outgoing = sourceCenter.clone().sub(primaryImpact).normalize();
    addAngleArc(primaryImpact, incoming, outgoing, 1.0, palette.rayHot, t(&quot;deflectionAngle&quot;));

    addDoubleArrow(OBSERVER_Z, LENS_Z, -2.28, &quot;Dₗ&quot;);
    addDoubleArrow(LENS_Z, SOURCE_Z, -2.28, &quot;Dₗₛ&quot;);
    addDoubleArrow(OBSERVER_Z, SOURCE_Z, -2.76, &quot;Dₛ&quot;);

    xValue.textContent = betaX.toFixed(2);
    yValue.textContent = betaY.toFixed(2);
    densityValue.textContent = String(density);
    const einsteinRadius = currentEinsteinRadius();
    if (requiresNumericalLensSolutions()) {
      const shear = currentShear();
      const { gamma1, gamma2 } = currentShearComponents();
      const shearAngle = currentShearAngle();
      const axisRatio = currentDeflectionAxisRatio();
      const formationDescription = axisRatio &lt; 0.995
        ? t(&quot;formationElliptical&quot;)
        : shear &lt; 0.01
          ? t(&quot;formationAxisymmetric&quot;)
          : t(&quot;formationSheared&quot;);
      const solutionDescription = shear &lt; 0.01 &amp;&amp; axisRatio &gt;= 0.995 &amp;&amp; beta &lt; 0.01 * einsteinRadius
        ? t(&quot;solutionsRing&quot;)
        : t(&quot;solutionsCount&quot;, { count: centralSolutions.length });
      status.innerHTML = t(&quot;statusShear&quot;, {
        q: axisRatio.toFixed(2),
        massAngle: finiteNumber(lensParameters.massAngle, 0).toFixed(1),
        gamma: shear.toFixed(2),
        g1: gamma1.toFixed(3),
        g2: gamma2.toFixed(3),
        angle: shearAngle.toFixed(1),
        thetaE: einsteinRadius.toFixed(2),
        betaX: betaX.toFixed(2),
        betaY: betaY.toFixed(2),

        formation: formationDescription,
        solutions: solutionDescription

    } else {

      const thetaMinus = beta - einsteinRadius;
      const imageDescription = beta &lt; 0.01 * einsteinRadius
        ? t(&quot;sisRingDescription&quot;)
        : beta &lt; 0.35 * einsteinRadius
          ? t(&quot;sisArcDescription&quot;)
          : beta &lt; einsteinRadius
            ? t(&quot;sisDoubleDescription&quot;)
            : t(&quot;sisSingleDescription&quot;);
      const solutionText = beta &lt; einsteinRadius
        ? t(&quot;sisTwoSolutions&quot;, { plus: thetaPlus.toFixed(2), minus: thetaMinus.toFixed(2) })
        : t(&quot;sisOneSolution&quot;, { plus: thetaPlus.toFixed(2) });
      status.innerHTML = t(&quot;statusSis&quot;, {
        betaX: betaX.toFixed(2),
        betaY: betaY.toFixed(2),
        beta: beta.toFixed(2),
        betaNorm: (beta / einsteinRadius).toFixed(2),
        thetaE: einsteinRadius.toFixed(2),

  }

    const lensX = finiteNumber(lensParameters.lensX, 0);
    const lensY = finiteNumber(lensParameters.lensY, 0);
    xInput.value = String(THREE.MathUtils.clamp(-dragPoint.x / BETA_SCALE - lensX, -1.5, 1.5));
    yInput.value = String(THREE.MathUtils.clamp(dragPoint.y / BETA_SCALE - lensY, -1.5, 1.5));

    side: () =&gt; setCamera(new THREE.Vector3(11.8, 0.4, 5.0), new THREE.Vector3(-0.62, 0, 5.0)),
    observer: () =&gt; setCamera(new THREE.Vector3(0, 0, -4.2), new THREE.Vector3(0, 0, 5.3))

  let currentView = &quot;perspective&quot;;

  function saveState() {
    window.openai?.setWidgetState?.({
      modelContent: {
        sourceX: Number(xInput.value),
        sourceY: Number(yInput.value),
        rayDensity: Number(densityInput.value),
        lensModel: lensModelInput.value,
        externalShear: Number(shearInput.value),
        massModel: lensParameters.massModel,
        lensRedshift: finiteNumber(lensParameters.lensRedshift, 0.5),
        sourceRedshift: finiteNumber(lensParameters.sourceRedshift, 1.0),
        lensX: finiteNumber(lensParameters.lensX, 0),
        lensY: finiteNumber(lensParameters.lensY, 0),
        massAxisRatio: currentAxisRatio(),
        massAngle: finiteNumber(lensParameters.massAngle, 0),
        shearGamma1: currentShearComponents().gamma1,
        shearGamma2: currentShearComponents().gamma2,
        einsteinRadius: currentEinsteinRadius(),
        sourceModel: lensParameters.sourceModel,
        sourceIntensity: finiteNumber(lensParameters.sourceIntensity, 1),
        sourceEffectiveRadius: currentSourceEffectiveRadius(),
        sourceSersicIndex: finiteNumber(lensParameters.sourceSersicIndex, 1),
        sourceAxisRatio: currentSourceAxisRatio(),
        sourceAngle: finiteNumber(lensParameters.sourceAngle, 0),
        lensLightEnabled: Boolean(lensParameters.lensLightEnabled),
        lensLightIntensity: finiteNumber(lensParameters.lensLightIntensity, 0.28),
        lensLightEffectiveRadius: finiteNumber(lensParameters.lensLightEffectiveRadius, 0.58),
        lensLightSersicIndex: finiteNumber(lensParameters.lensLightSersicIndex, 2.4),
        lensLightAxisRatio: currentLensLightAxisRatio(),
        lensLightAngle: finiteNumber(lensParameters.lensLightAngle, 0),
        language: currentLanguage,
        showPlanes: showPlanesInput.checked,
        showRedshift: showRedshiftInput.checked,
        showRays: showRaysInput.checked,

  const saved = window.openai?.widgetState || {};
  const savedModel = saved.modelContent || {};
  applyIncomingModel(savedModel);
  if (Number.isFinite(Number(savedModel.sourceX))) xInput.value = String(savedModel.sourceX);
  if (Number.isFinite(Number(savedModel.sourceY))) yInput.value = String(savedModel.sourceY);
  if (Number.isFinite(Number(savedModel.rayDensity))) densityInput.value = String(savedModel.rayDensity);
  if (typeof savedModel.showPlanes === &quot;boolean&quot;) showPlanesInput.checked = savedModel.showPlanes;
  if (typeof savedModel.showRedshift === &quot;boolean&quot;) showRedshiftInput.checked = savedModel.showRedshift;
  if (typeof savedModel.showRays === &quot;boolean&quot;) showRaysInput.checked = savedModel.showRays;
  if (typeof savedModel.showAnnotations === &quot;boolean&quot;) showAnnotationsInput.checked = savedModel.showAnnotations;
  currentView = saved.privateContent?.view in views ? saved.privateContent.view : &quot;perspective&quot;;

  function chooseView(name) {
    currentView = name;
    observer.visible = name !== &quot;observer&quot;;
    views[name]();
    [&quot;perspective&quot;, &quot;side&quot;, &quot;observer&quot;].forEach((viewName) =&gt; {
      const button = document.getElementById(&quot;lp3d-&quot; + viewName);
      button.classList.toggle(&quot;btn-primary&quot;, viewName === name);

  document.getElementById(&quot;lp3d-perspective&quot;).addEventListener(&quot;click&quot;, () =&gt; chooseView(&quot;perspective&quot;));
  document.getElementById(&quot;lp3d-side&quot;).addEventListener(&quot;click&quot;, () =&gt; chooseView(&quot;side&quot;));
  document.getElementById(&quot;lp3d-observer&quot;).addEventListener(&quot;click&quot;, () =&gt; chooseView(&quot;observer&quot;));

  [xInput, yInput, densityInput].forEach((input) =&gt; {
    input.addEventListener(&quot;input&quot;, updateGeometry);
    input.addEventListener(&quot;change&quot;, saveState);
  });
  shearInput.addEventListener(&quot;input&quot;, () =&gt; {
    lensParameters.shearGamma1 = Math.max(0, finiteNumber(shearInput.value, 0));
    lensParameters.shearGamma2 = 0;
    if (lensParameters.shearGamma1 &gt; 0.0001) lensParameters.massModel = &quot;isothermal_shear&quot;;
    lensModelInput.value = hasShearModel() ? &quot;cross&quot; : &quot;point&quot;;
    updateGeometry();
  });
  shearInput.addEventListener(&quot;change&quot;, saveState);
  lensModelInput.addEventListener(&quot;change&quot;, () =&gt; {
    if (lensModelInput.value === &quot;cross&quot;) {
      lensParameters.massModel = &quot;isothermal_shear&quot;;
      if (currentShear() &lt; 0.0001) lensParameters.shearGamma1 = 0.18;
    } else {
      lensParameters.massModel = currentAxisRatio() &lt; 0.995 ? &quot;isothermal&quot; : &quot;isothermal_sph&quot;;
      lensParameters.shearGamma1 = 0;
      lensParameters.shearGamma2 = 0;
    }
    shearInput.value = String(currentShear());
    updateGeometry();
    saveState();
  });
  [showPlanesInput, showRedshiftInput, showRaysInput, showAnnotationsInput].forEach((input) =&gt; {
    input.addEventListener(&quot;change&quot;, () =&gt; {
      applyLayerVisibility();
      saveState();
    });
  });

  function resize() {
    const width = Math.max(stage.clientWidth, 320);
    const height = Math.max(stage.clientHeight, 420);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);

  window.addEventListener(&quot;openai:set_globals&quot;, (event) =&gt; {
    const globals = event.detail?.globals || {};
    const model = globals.widgetState?.modelContent || {};
    if (!globals.language &amp;&amp; Object.keys(model).length === 0) return;
    const languageChanged = applyIncomingModel(model, globals);
    if (Number.isFinite(Number(model.sourceX))) xInput.value = String(model.sourceX);
    if (Number.isFinite(Number(model.sourceY))) yInput.value = String(model.sourceY);
    if (Number.isFinite(Number(model.rayDensity))) densityInput.value = String(model.rayDensity);
    if (typeof model.showPlanes === &quot;boolean&quot;) showPlanesInput.checked = model.showPlanes;
    if (typeof model.showRedshift === &quot;boolean&quot;) showRedshiftInput.checked = model.showRedshift;
    if (typeof model.showRays === &quot;boolean&quot;) showRaysInput.checked = model.showRays;
    if (typeof model.showAnnotations === &quot;boolean&quot;) showAnnotationsInput.checked = model.showAnnotations;
    if (languageChanged) applyLanguage(false);
    applyLayerVisibility();
    updateGeometry();
  });

  applyLanguage(false);
  applyLayerVisibility();
  chooseView(currentView);
  updateGeometry();
  resize();

  function animate(time) {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
